name: Build GUI patcher

on:
  push: {}
  workflow_dispatch: {}

env:
  # Wiimms ISO Tool release to bundle. GPLv2; see gpl-2.0.txt inside each archive.
  WIT_VERSION: v3.05a-r8638

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-universal
            os: macos-14
          - target: linux-x86_64
            os: ubuntu-22.04
          - target: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify tkinter is available
        shell: bash
        run: |
          sudo apt-get install -y python3-tk 2>/dev/null || true
          python -c "import tkinter; print('tkinter ok')"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Fetch and stage wit (macOS)
        if: matrix.target == 'macos-universal'
        run: |
          curl -fsSL "https://wit.wiimm.de/download/wit-${{ env.WIT_VERSION }}-mac.tar.gz" -o wit.tar.gz
          mkdir wit_pkg && tar -xzf wit.tar.gz -C wit_pkg
          WITBIN=$(find wit_pkg -type f -path '*/bin/wit')
          GPL=$(find wit_pkg -type f -name 'gpl-2.0.txt')
          chmod +x "$WITBIN"
          mkdir wit_bin && cp "$WITBIN" wit_bin/
          cp "$GPL" wit-gpl-2.0.txt

      - name: Fetch and stage wit (Linux)
        if: matrix.target == 'linux-x86_64'
        run: |
          curl -fsSL "https://wit.wiimm.de/download/wit-${{ env.WIT_VERSION }}-x86_64.tar.gz" -o wit.tar.gz
          mkdir wit_pkg && tar -xzf wit.tar.gz -C wit_pkg
          WITBIN=$(find wit_pkg -type f -path '*/bin/wit')
          GPL=$(find wit_pkg -type f -name 'gpl-2.0.txt')
          chmod +x "$WITBIN"
          mkdir wit_bin && cp "$WITBIN" wit_bin/
          cp "$GPL" wit-gpl-2.0.txt

      - name: Fetch and stage wit (Windows / Cygwin)
        if: matrix.target == 'windows-x86_64'
        shell: bash
        run: |
          curl -fsSL "https://wit.wiimm.de/download/wit-${{ env.WIT_VERSION }}-cygwin64.zip" -o wit.zip
          unzip -q wit.zip
          mkdir wit_bin
          # wit.exe needs its whole cygwin runtime (cygwin1.dll etc) alongside it.
          cp wit-${{ env.WIT_VERSION }}-cygwin64/bin/*.exe wit-${{ env.WIT_VERSION }}-cygwin64/bin/*.dll wit_bin/
          cp wit-${{ env.WIT_VERSION }}-cygwin64/gpl-2.0.txt wit-gpl-2.0.txt

      - name: Build app (macOS)
        if: matrix.target == 'macos-universal'
        run: |
          BINS=""
          for f in wit_bin/*; do BINS="$BINS --add-binary $f:."; done
          pyinstaller --name ACCF-SDHC-Patcher --windowed --noconfirm \
            --icon assets/icon.icns --target-architecture universal2 \
            $BINS --distpath pyinst_dist tools/gui.py
          cp wit-gpl-2.0.txt "pyinst_dist/ACCF-SDHC-Patcher.app/Contents/Resources/wit-gpl-2.0.txt"
          cd pyinst_dist
          zip -qr "../ACCF-SDHC-Patcher-${{ matrix.target }}.zip" ACCF-SDHC-Patcher.app

      - name: Build app (Linux)
        if: matrix.target == 'linux-x86_64'
        run: |
          BINS=""
          for f in wit_bin/*; do BINS="$BINS --add-binary $f:."; done
          pyinstaller --name ACCF-SDHC-Patcher --windowed --noconfirm \
            $BINS --distpath pyinst_dist tools/gui.py
          cp wit-gpl-2.0.txt pyinst_dist/ACCF-SDHC-Patcher/
          cd pyinst_dist
          tar -czf "../ACCF-SDHC-Patcher-${{ matrix.target }}.tar.gz" ACCF-SDHC-Patcher

      - name: Build app (Windows)
        if: matrix.target == 'windows-x86_64'
        shell: bash
        run: |
          BINS=""
          for f in wit_bin/*; do BINS="$BINS --add-binary $f;."; done
          pyinstaller --name ACCF-SDHC-Patcher --windowed --noconfirm \
            --icon assets/icon.ico \
            $BINS --distpath pyinst_dist tools/gui.py
          cp wit-gpl-2.0.txt pyinst_dist/ACCF-SDHC-Patcher/
          cd pyinst_dist
          7z a "../ACCF-SDHC-Patcher-${{ matrix.target }}.zip" ACCF-SDHC-Patcher \
            || powershell -Command "Compress-Archive -Path ACCF-SDHC-Patcher -DestinationPath ../ACCF-SDHC-Patcher-${{ matrix.target }}.zip"

      - name: Package app + Gecko codes variant
        shell: bash
        run: |
          rm -rf bundle && mkdir -p bundle/gecko
          cp gecko/*.txt bundle/gecko/
          if [[ "${{ matrix.target }}" == windows* ]]; then
            cp -r pyinst_dist/ACCF-SDHC-Patcher bundle/
            cd bundle && 7z a "../ACCF-SDHC-Patcher-${{ matrix.target }}-with-gecko.zip" . \
              || powershell -Command "Compress-Archive -Path * -DestinationPath ../ACCF-SDHC-Patcher-${{ matrix.target }}-with-gecko.zip"
          elif [[ "${{ matrix.target }}" == macos* ]]; then
            cp -r pyinst_dist/ACCF-SDHC-Patcher.app bundle/
            cd bundle && zip -qr "../ACCF-SDHC-Patcher-${{ matrix.target }}-with-gecko.zip" .
          else
            cp -r pyinst_dist/ACCF-SDHC-Patcher bundle/
            cd bundle && tar -czf "../ACCF-SDHC-Patcher-${{ matrix.target }}-with-gecko.tar.gz" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ACCF-SDHC-Patcher-${{ matrix.target }}
          path: ACCF-SDHC-Patcher-${{ matrix.target }}.*

      - uses: actions/upload-artifact@v4
        with:
          name: ACCF-SDHC-Patcher-${{ matrix.target }}-with-gecko
          path: ACCF-SDHC-Patcher-${{ matrix.target }}-with-gecko.*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ACCF-SDHC-Patcher-${{ matrix.target }}.*
            ACCF-SDHC-Patcher-${{ matrix.target }}-with-gecko.*
